
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>SMS Study Hub | School Learning</title>
<style>
:root {
  --blue:#155eef;
  --dark:#12264a;
  --pale:#eff5ff;
  --muted:#66758e;
  --border:#e0e8f5;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f9ff;
  color:var(--dark);
  line-height:1.6;
}
header {
  background:white;
  padding:16px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
.logo { font-size:22px;font-weight:800;color:var(--blue); }
header a { text-decoration:none;color:var(--dark); }
main { max-width:1100px;margin:auto;padding:25px 5%; }
.hero {
  background:linear-gradient(135deg,#e4edff,white);
  padding:35px 24px;
  border-radius:20px;
  margin:12px 0 28px;
}
.hero h1 { font-size:clamp(28px,5vw,43px);line-height:1.2;margin:8px 0; }
.hero p { color:var(--muted); }
h2 { font-size:25px; }
.muted { color:var(--muted); }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:16px;
}
.card {
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  box-shadow:0 5px 20px #10244b08;
}
.card h3 { margin:8px 0; }
.card p { color:var(--muted);font-size:14px; }
.symbol { font-size:35px; }
button,.button {
  display:inline-block;
  border:0;
  background:var(--blue);
  color:white;
  padding:12px 17px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  font-size:14px;
}
button:hover,.button:hover { background:#1047c8; }
.secondary { background:#eaf1ff;color:var(--blue); }
.secondary:hover { background:#dbe7ff; }
.back { margin-bottom:18px; }
.hidden { display:none !important; }
.breadcrumb { color:var(--muted);font-size:14px;margin-bottom:12px; }
.subject-card { display:flex;flex-direction:column;align-items:flex-start; }
.subject-card .button { margin-top:8px; }
.resource-link { display:block;margin:12px 0;color:var(--blue);font-weight:bold; }
label { display:block;font-weight:bold;font-size:14px;margin:13px 0 5px; }
input,select,textarea {
  width:100%;
  padding:12px;
  border:1px solid #ccd7e8;
  border-radius:8px;
  font:inherit;
  background:white;
}
textarea { min-height:85px;resize:vertical; }
form { max-width:580px; }
.info {
  background:#eaf1ff;
  border-radius:12px;
  padding:16px;
  margin:15px 0;
  overflow-wrap:anywhere;
}
.success {
  background:#e5f8ed;
  color:#096b42;
  padding:14px;
  border-radius:9px;
  margin-top:15px;
}
footer {
  text-align:center;
  padding:24px;
  background:#12264a;
  color:white;
  margin-top:35px;
}
footer p { font-size:13px;color:#d6e1f7; }
@media(max-width:480px) {
  header { align-items:flex-start; }
  .logo { font-size:19px; }
  main { padding:20px 4%; }
  .hero { padding:25px 18px; }
}
</style>
</head>
<body>

<header>
  <a href="#" class="logo" onclick="goHome();return false;">📘 SMS Study Hub</a>
  <a href="#offline" onclick="showOffline();return false;">Join Offline Class</a>
</header>

<main>
  <div id="app"></div>
</main>

<footer>
  <strong>SMS Study Hub</strong>
  <p>Learn • Practice • Succeed</p>
  <p>School education for BSEB and CBSE students</p>
</footer>

<script>
// CUSTOMIZE THESE DETAILS BEFORE PUBLISHING
const CONTACT = {
  address: "Basara Bazar, Main Road, Near Manibhushan Welding Dukan, Jaintpur",
  phone: "+91-7352619116"
};

const boards = {
  BSEB: {
    title: "BSEB Bihar Board",
    classes: [6,7,8,9,10]
  },
  CBSE: {
    title: "CBSE Board",
    classes: [6,7,8,9,10]
  }
};

const subjects = [
  {name:"Mathematics", icon:"📐"},
  {name:"Science", icon:"🔬"},
  {name:"Social Science (SST)", icon:"🌍"},
  {name:"English", icon:"📚"},
  {name:"Hindi", icon:"📝"},
  {name:"Sanskrit", icon:"🔤"},
  {name:"Computer", icon:"💻"}
];

let selectedBoard = "";
let selectedClass = "";
let selectedSubject = "";

const app = document.getElementById("app");

function goHome() {
  selectedBoard = "";
  selectedClass = "";
  selectedSubject = "";
  renderHome();
  window.scrollTo(0,0);
}

function renderHome() {
  app.innerHTML = `
    <section class="hero">
      <h1>Welcome to SMS Study Hub 🎓</h1>
      <p>Choose your board, class and subject to find study notes
      and video lessons.</p>
      <button onclick="document.getElementById('boards').scrollIntoView({behavior:'smooth'})">
        Start Learning →
      </button>
    </section>

    <section id="boards">
      <h2>Choose Your Board</h2>
      <p class="muted">Apna school board select karein.</p>
      <div class="grid">
        <article class="card">
          <div class="symbol">🏫</div>
          <h3>BSEB</h3>
          <p>Bihar School Examination Board</p>
          <button onclick="chooseBoard('BSEB')">Select BSEB →</button>
        </article>
        <article class="card">
          <div class="symbol">🎓</div>
          <h3>CBSE</h3>
          <p>Central Board of Secondary Education</p>
          <button onclick="chooseBoard('CBSE')">Select CBSE →</button>
        </article>
      </div>
    </section>

    <section style="margin-top:35px">
      <div class="info">
        <strong>Offline classes available?</strong>
        <p>Apni offline class ke baare mein jaankari paane
        aur admission enquiry form bharne ke liye click karein.</p>
        <button onclick="showOffline()">Join Offline Class</button>
      </div>
    </section>`;
}

function chooseBoard(board) {
  selectedBoard = board;
  renderClasses();
  window.scrollTo(0,0);
}

function renderClasses() {
  const cards = boards[selectedBoard].classes.map(c => `
    <article class="card">
      <div class="symbol">📘</div>
      <h3>Class ${c}</h3>
      <p>${boards[selectedBoard].title}</p>
      <button onclick="chooseClass(${c})">Open Class ${c} →</button>
    </article>`).join("");

  app.innerHTML = `
    <div class="breadcrumb">
      <a href="#" onclick="goHome();return false;">Home</a>
      / ${boards[selectedBoard].title}
    </div>
    <button class="secondary back" onclick="goHome()">← Back to Boards</button>
    <h2>${boards[selectedBoard].title}</h2>
    <p class="muted">Choose your class.</p>
    <div class="grid">${cards}</div>
    <div class="info">
      <strong>Join Offline Class</strong>
      <p>Enquiry form aur contact details ke liye.</p>
      <button onclick="showOffline()">Join Offline Class</button>
    </div>`;
}

function chooseClass(c) {
  selectedClass = c;
  renderSubjects();
  window.scrollTo(0,0);
}

function renderSubjects() {
  const cards = subjects.map((s,i) => `
    <article class="card">
      <div class="symbol">${s.icon}</div>
      <h3>${s.name}</h3>
      <p>Class ${selectedClass} • ${boards[selectedBoard].title}</p>
      <button onclick="chooseSubject(${i})">Open Subject →</button>
    </article>`).join("");

  app.innerHTML = `
    <div class="breadcrumb">
      <a href="#" onclick="goHome();return false;">Home</a>
      / ${selectedBoard} / Class ${selectedClass}
    </div>
    <button class="secondary back" onclick="renderClasses()">← Back to Classes</button>
    <h2>Class ${selectedClass} Subjects</h2>
    <p class="muted">Choose a subject to open its notes and videos.</p>
    <div class="grid">${cards}</div>
    <div class="info">
      <strong>Need classroom teaching?</strong>
      <p>Fill out the offline class enquiry form.</p>
      <button onclick="showOffline()">Join Offline Class</button>
    </div>`;
}

function chooseSubject(index) {
  selectedSubject = subjects[index].name;
  renderSubjectResources();
  window.scrollTo(0,0);
}

function renderSubjectResources() {
  app.innerHTML = `
    <div class="breadcrumb">
      ${selectedBoard} / Class ${selectedClass} / ${selectedSubject}
    </div>
    <button class="secondary back" onclick="renderSubjects()">← Back to Subjects</button>
    <h2>${selectedSubject}</h2>
    <p class="muted">${boards[selectedBoard].title} • Class ${selectedClass}</p>

    <div class="grid">
      <article class="card">
        <div class="symbol">📄</div>
        <h3>Study Notes</h3>
        <p>Chapter-wise notes and PDF study materials.</p>
        <p>Add your own PDF link to this subject to let students
        access the correct notes.</p>
        <a class="resource-link" href="https://drive.google.com/"
          target="_blank" rel="noopener">Open Google Drive ↗</a>
      </article>
      <article class="card">
        <div class="symbol">🎬</div>
        <h3>Video Lessons</h3>
        <p>Watch lessons for ${selectedSubject}.</p>
        <a class="resource-link"
          href="https://www.youtube.com/results?search_query=${encodeURIComponent(boards[selectedBoard].title+" class "+selectedClass+" "+selectedSubject+" lessons")}"
          target="_blank" rel="noopener">Find video lessons ↗</a>
      </article>
    </div>

    <div class="info">
      <strong>Want to study in person?</strong>
      <p>Join an offline class. Open the enquiry form to see the
      class address and contact number.</p>
      <button onclick="showOffline()">Join Offline Class</button>
    </div>`;
}

function showOffline() {
  app.innerHTML = `
    <div class="breadcrumb">Home / Offline Class</div>
    <button class="secondary back" onclick="goHome()">← Home</button>
    <h2>Join Offline Class 🏫</h2>
    <p class="muted">Fill in this form to enquire about admission.</p>

    <div class="info">
      <strong>📍 Class Address</strong>
      <p>${CONTACT.address}</p>
      <strong>📞 Mobile Number</strong>
      <p>${CONTACT.phone}</p>
    </div>

    <div class="card">
      <form id="offline-form">
        <label for="student">Student Name *</label>
        <input id="student" name="student" required maxlength="80"
          placeholder="Enter your full name">

        <label for="mobile">Student/Parent Mobile Number *</label>
        <input id="mobile" name="mobile" type="tel" required
          inputmode="numeric" pattern="[0-9+() -]{10,16}"
          placeholder="Enter contact number">

        <label for="board">Board *</label>
        <select id="board" name="board" required>
          <option value="">Select board</option>
          <option>BSEB</option>
          <option>CBSE</option>
        </select>

        <label for="class">Class *</label>
        <select id="class" name="class" required>
          <option value="">Select class</option>
          <option>Class 6</option>
          <option>Class 7</option>
          <option>Class 8</option>
          <option>Class 9</option>
          <option>Class 10</option>
        </select>

        <label for="message">Message (optional)</label>
        <textarea id="message" name="message"
          placeholder="Ask about timings or fees"></textarea>

        <button type="submit">Submit Enquiry</button>
        <div id="form-result" aria-live="polite"></div>
      </form>
    </div>

    <p class="muted">
      Privacy: Do not enter passwords or other sensitive information.
    </p>`;

  document.getElementById("offline-form").addEventListener("submit", event => {
    event.preventDefault();
    const data = new FormData(event.target);
    const details = {
      name: data.get("student"),
      mobile: data.get("mobile"),
      board: data.get("board"),
      className: data.get("class"),
      message: data.get("message")
    };

    const result = document.getElementById("form-result");
    result.className = "success";
    result.textContent =
      "Form filled successfully. This demo does not send or save your enquiry. Please contact the mobile number shown above to complete your enquiry.";
  });

  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
</html>
